<svg viewBox="0 0 800 170" width="800" height="170" xmlns="http://www.w3.org/2000/svg" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Degradado animado del nombre -->
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="35%" stop-color="#a64dff"/>
      <stop offset="70%" stop-color="#2ec5ff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
      <animate attributeName="x1" values="0;-800;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;0;800" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Brillo suave detrás -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Destello de 4 puntas -->
    <path id="star" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>

    <style>
      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .term {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: 18px;
        fill: #8b949e;
      }
      .prompt { fill: #2ec5ff; font-weight: 700; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .reveal { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

      .sub { animation: rise 1.2s .6s cubic-bezier(.2,.8,.2,1) both; }

      .line {
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: draw 1.4s .3s ease-out forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
        50% { opacity: 1; transform: scale(1) rotate(45deg); }
      }

      .dot { animation: float 7s linear infinite; }
      @keyframes float {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: .8; }
        100% { transform: translateY(-150px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Partículas que suben -->
  <g fill="url(#grad)">
    <circle class="dot" cx="90"  cy="170" r="2.5" style="animation-delay:0s"/>
    <circle class="dot" cx="210" cy="170" r="1.8" style="animation-delay:2.5s"/>
    <circle class="dot" cx="330" cy="170" r="2.2" style="animation-delay:4.5s"/>
    <circle class="dot" cx="470" cy="170" r="1.6" style="animation-delay:1.2s"/>
    <circle class="dot" cx="590" cy="170" r="2.6" style="animation-delay:3.6s"/>
    <circle class="dot" cx="710" cy="170" r="2"   style="animation-delay:5.8s"/>
  </g>

  <!-- Nombre: capa de brillo + capa nítida -->
  <g class="reveal">
    <text class="name" x="400" y="88" text-anchor="middle" fill="url(#grad)" filter="url(#glow)" opacity=".55">Ingrid Albert</text>
    <text class="name" x="400" y="88" text-anchor="middle" fill="url(#grad)">Ingrid Albert</text>
  </g>

  <!-- Línea que se dibuja -->
  <line class="line" x1="190" y1="108" x2="610" y2="108" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Destellos -->
  <g fill="url(#grad)">
    <use href="#star" x="115" y="38"  class="tw" style="animation-delay:0s"/>
    <use href="#star" x="690" y="30"  class="tw" style="animation-delay:.8s"/>
    <use href="#star" x="690" y="95"  class="tw" style="animation-delay:1.6s" transform="scale(1)"/>
    <use href="#star" x="115" y="100" class="tw" style="animation-delay:1.2s"/>
    <use href="#star" x="400" y="18"  class="tw" style="animation-delay:2s"/>
  </g>

  <!-- Línea de terminal -->
  <text class="term sub" x="62" y="148"><tspan class="prompt">ingrid@github:~$</tspan> echo "aprendiendo Linux, un comando a la vez"<tspan class="cursor" fill="#2ec5ff">▌</tspan></text>
</svg>
