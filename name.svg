<svg viewBox="0 0 800 130" width="800" height="130" xmlns="http://www.w3.org/2000/svg" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="35%" stop-color="#00c8f5"/>
      <stop offset="70%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
      <animate attributeName="x1" values="0;-800;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;0;800" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <path id="star" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>

    <style>
      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .reveal { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

      .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
        50% { opacity: 1; transform: scale(1) rotate(45deg); }
      }

      .dot { animation: float 7s linear infinite; }
      @keyframes float {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: .8; }
        100% { transform: translateY(-120px); opacity: 0; }
      }
    </style>
  </defs>

  <g fill="url(#grad)">
    <circle class="dot" cx="90"  cy="130" r="2.5" style="animation-delay:0s"/>
    <circle class="dot" cx="210" cy="130" r="1.8" style="animation-delay:2.5s"/>
    <circle class="dot" cx="330" cy="130" r="2.2" style="animation-delay:4.5s"/>
    <circle class="dot" cx="470" cy="130" r="1.6" style="animation-delay:1.2s"/>
    <circle class="dot" cx="590" cy="130" r="2.6" style="animation-delay:3.6s"/>
    <circle class="dot" cx="710" cy="130" r="2"   style="animation-delay:5.8s"/>
  </g>

  <g class="reveal">
    <text class="name" x="400" y="90" text-anchor="middle" fill="url(#grad)" filter="url(#glow)" opacity=".55">Ingrid Albert</text>
    <text class="name" x="400" y="90" text-anchor="middle" fill="url(#grad)">Ingrid Albert</text>
  </g>

  <g fill="url(#grad)">
    <use href="#star" x="115" y="40"  class="tw" style="animation-delay:0s"/>
    <use href="#star" x="690" y="32"  class="tw" style="animation-delay:.8s"/>
    <use href="#star" x="690" y="100" class="tw" style="animation-delay:1.6s"/>
    <use href="#star" x="115" y="102" class="tw" style="animation-delay:1.2s"/>
    <use href="#star" x="400" y="20"  class="tw" style="animation-delay:2s"/>
  </g>
</svg>
